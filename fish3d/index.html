<style>
:root{
  --ink:#2d4b5d; --ink-soft:#56758a; --title:#4a8bb2; --deep:#2f6f93;
  --sea:#eaf7f9; --paper:#fffdf8; --coral:#ee8a6c; --coral-d:#cf6a4c; --mint:#7fc9b3; --lav:#ad95d6; --sun:#f2c66d;

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:"Noto Sans TC",system-ui,-apple-system,"Microsoft JhengHei",sans-serif;color:var(--ink);line-height:1.6;

button{font:inherit;color:inherit}
#stage{position:fixed;inset:0;touch-action:none}

#labels{position:fixed;inset:0;pointer-events:none}

.top>*{pointer-events:auto}
.back{flex:0 0 auto;text-decoration:none;color:var(--deep);font-size:14px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.75);box-shadow:0 1px 4px rgba(47,111,147,.12)}
.top h1{margin:0;font-size:clamp(19px,2.3vw,27px);color:var(--title);letter-spacing:.06em;line-height:1.2;white-space:nowrap}
.top h1 small{display:block;font-size:12.5px;letter-spacing:.08em;color:var(--ink-soft);font-family:"Noto Sans TC",sans-serif;font-weight:400}
.tabs{margin-left:auto;display:flex;background:rgba(255,255,255,.8);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.tabs button{border:0;background:none;padding:7px 16px;border-radius:999px;font-size:16px;cursor:pointer;color:var(--deep);white-space:nowrap}
.tabs button.on{background:linear-gradient(135deg,#6db4d4,var(--deep));color:#fff}

/* panels */
.panel{position:fixed;z-index:9;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.9);border-radius:20px;box-shadow:var(--shadow)}
.parts{left:16px;top:78px;width:258px;max-height:calc(100vh - 190px);overflow:auto;padding:14px 14px 12px}
.parts h2,.info h2{margin:0 0 8px;font-size:19px;color:var(--deep)}
.plist{list-style:none;margin:0;padding:0}
.plist li{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:10px;cursor:pointer;font-size:15px}
.plist li:hover{background:rgba(109,180,212,.12)}
.plist li.sel{background:rgba(109,180,212,.22)}
.plist li.off .nm{opacity:.45;text-decoration:line-through}
.dot{width:12px;height:12px;border-radius:50%;flex:0 0 auto;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.plist .nm{flex:1}

.plist .seen{width:14px;color:var(--mint);font-size:13px;text-align:center}
.eye{border:0;background:rgba(255,255,255,.8);border-radius:8px;width:28px;height:24px;cursor:pointer;font-size:12px;color:var(--ink-soft);box-shadow:inset 0 0 0 1px var(--line)}
.yield{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.yield h3{margin:0 0 6px;font-size:15px;color:var(--deep)}
.bar{display:flex;height:22px;border-radius:7px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.bar span{display:block;height:100%;cursor:pointer;border-right:2px solid var(--paper)}
.bar span:last-child{border-right:0}
.bar span:hover{filter:brightness(1.08)}
.yield p{margin:6px 0 0;font-size:13px;color:var(--ink-soft)}

.progress{margin-top:10px;font-size:13.5px;color:var(--ink-soft)}

.info{right:16px;top:78px;width:330px;max-height:calc(100vh - 190px);overflow:auto;padding:16px 18px}

.info h2{display:flex;align-items:center;gap:8px;font-size:24px}
.info h3{margin:12px 0 4px;font-size:16px;color:var(--deep)}
.info p{margin:0;font-size:15px}
.info ul{margin:0;padding-left:1.25em;font-size:15px}
.info li{margin:2px 0}
.info .pct{margin-top:6px;font-size:13.5px;color:var(--ink-soft)}
.info .pct .track{height:8px;border-radius:9px;background:rgba(79,139,178,.13);margin-top:3px;overflow:hidden}

.info .lesson{margin-top:12px;padding:8px 10px;border-radius:12px;background:rgba(127,201,179,.16);font-size:14px}
.info .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.info .close{position:absolute;right:10px;top:8px;border:0;background:none;font-size:22px;cursor:pointer;color:var(--ink-soft);display:none}
.hello p{color:var(--ink-soft)}

/* dock */
.dock{position:fixed;z-index:9;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;
  padding:10px 14px;max-width:calc(100vw - 24px)}
.btn{border:0;cursor:pointer;padding:8px 14px;border-radius:999px;font-size:15.5px;background:#fff;color:var(--deep);box-shadow:inset 0 0 0 1px var(--line),0 1px 3px rgba(47,111,147,.1);white-space:nowrap}

.btn.pri{background:linear-gradient(135deg,#f3a184,var(--coral));color:#fff;box-shadow:0 3px 10px rgba(207,106,76,.25)}

.sep{width:1px;height:26px;background:var(--line)}

/* labels */

.lbl.sel{background:var(--deep);color:#fff}
body.game .lbl{cursor:grab;touch-action:none;transform:translateY(-34px)}
body.game .lbl:hover{transform:translateY(-36px) scale(1.04)}
body.game .lbl:active{cursor:grabbing}
.lbl em{font-style:normal;font-size:12px;color:var(--ink-soft)}
.lbl.sel em{color:#d6ecf5}

/* game */
.gamebar{position:fixed;z-index:9;left:50%;top:76px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:9px 14px;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 24px)}
.gamebar .goal{font-size:15px}
.gamebar .cnt{font-family:"LXGW WenKai TC",serif;font-size:20px;color:var(--coral-d)}
.gamebar .tm{font-variant-numeric:tabular-nums;color:var(--ink-soft)}
.toast{position:fixed;z-index:30;left:50%;bottom:96px;transform:translate(-50%,20px);opacity:0;pointer-events:none;transition:all .35s;
  background:rgba(47,111,147,.94);color:#fff;padding:10px 18px;border-radius:16px;font-size:15.5px;max-width:min(560px,calc(100vw - 32px));text-align:center;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(20,50,70,.28)}
.modal.show{display:flex}
.modal .card{background:var(--paper);border-radius:24px;padding:26px 28px;max-width:440px;margin:16px;text-align:center;box-shadow:var(--shadow)}
.modal h2{margin:0 0 6px;color:var(--title);font-size:28px}
.modal .big{font-family:"LXGW WenKai TC",serif;font-size:22px;color:var(--coral-d);margin:4px 0 10px}
.modal p{margin:0 0 16px;font-size:15.5px}
.loading{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:#eaf6f9;transition:opacity .6s;font-family:"LXGW WenKai TC",serif;color:var(--deep);font-size:20px}
.loading i{width:46px;height:46px;border-radius:50%;border:4px solid rgba(47,111,147,.15);border-top-color:var(--coral);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.mtoggle{display:none}
[hidden]{display:none!important}
body.game .parts,body.game .info{display:none}

@media (max-width:860px){
  .top{padding:8px 12px;gap:8px;flex-wrap:wrap}
  .top h1{font-size:18px}
  .top h1 small{display:none}
  .back{font-size:13px;padding:5px 10px}
  .tabs button{padding:6px 11px;font-size:14.5px}
  .parts{top:auto;bottom:0;left:0;right:0;width:auto;border-radius:20px 20px 0 0;max-height:62vh;transform:translateY(105%);transition:transform .3s;z-index:20}
  .parts.open{transform:none}
  .info{top:auto;bottom:0;left:0;right:0;width:auto;border-radius:20px 20px 0 0;max-height:56vh;transform:translateY(105%);transition:transform .3s;z-index:21}
  .info.open{transform:none}
  .info .close{display:block}
  .mtoggle{display:inline-block}
  .dock{bottom:10px;padding:8px 10px;gap:6px}
  .dock .wide{display:none}
  .btn{padding:7px 11px;font-size:14.5px}
  .slider input{width:min(170px,40vw)}
  .hint{bottom:auto;top:100px;font-size:12px}
  .gamebar{top:96px;gap:8px;padding:7px 10px}
  .gamebar .goal{display:none}
  .lbl{font-size:13px;padding:3px 9px 3px 7px}
  .lbl em{display:none}
}

</div>

<div class="panel gamebar" id="gamebar" hidden>

</div>

<div class="toast" id="toast"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ================= 小工具 ================= */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const sstep = (e0, e1, x) => { const k = clamp((x - e0) / (e1 - e0)); return k * k * (3 - 2 * k); };
const ease = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const mixc = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)];
function lin(tab, x) {
  if (x <= tab[0][0]) return tab[0][1];
  for (let i = 1; i < tab.length; i++) if (x <= tab[i][0]) {
    const [x0, y0] = tab[i - 1], [x1, y1] = tab[i]; const k = sstep(0, 1, (x - x0) / (x1 - x0)); return lerp(y0, y1, k);
  }
  return tab[tab.length - 1][1];
}
function hash(x, y) { let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
const fbm = (x, y) => vnoise(x, y) * .55 + vnoise(x * 2.1 + 7, y * 2.1 + 3) * .3 + vnoise(x * 4.3 + 1, y * 4.3 + 9) * .15;
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

/* ================= 魚體外形（t: 0=尾柄, 1=吻端；身體 x 由 -2 到 +2） ================= */
function profile(pts) {
  const c = new THREE.CatmullRomCurve3(pts.map(([t, y]) => V(t, y, 0)), false, 'centripetal');
  const arr = c.getPoints(800);
  return t => {
    t = clamp(t); let lo = 0, hi = arr.length - 1;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (arr[m].x < t) lo = m; else hi = m; }
    const a = arr[lo], b = arr[hi]; return lerp(a.y, b.y, (t - a.x) / ((b.x - a.x) || 1));
  };
}
const TOP = profile([[0, .3], [.035, .3], [.09, .37], [.18, .55], [.3, .74], [.42, .86], [.53, .9], [.63, .87], [.72, .78], [.8, .65], [.87, .51], [.93, .36], [.97, .23], [.99, .15], [1, .08]]);
const BOT = profile([[0, -.31], [.035, -.31], [.09, -.38], [.18, -.56], [.3, -.76], [.43, -.88], [.55, -.89], [.66, -.82], [.76, -.69], [.85, -.53], [.92, -.4], [.97, -.29], [.99, -.21], [1, -.15]]);
const WID = profile([[0, .07], [.1, .12], [.3, .25], [.5, .33], [.65, .34], [.8, .3], [.9, .24], [.96, .2], [.99, .15], [1, .11]]);
const X = t => -2 + 4 * t;
const prof = t => { const yt = TOP(t), yb = BOT(t); return { yc: (yt + yb) / 2, hh: (yt - yb) / 2, hw: WID(t) }; };
function bodyPt(t, th, s = 1, out = V()) {
  const p = prof(t), st = Math.sin(th), ct = Math.cos(th);
  const belly = 1 + .1 * Math.max(0, -st), ridge = 1 - .22 * Math.pow(Math.abs(st), 4);
  return out.set(X(t), p.yc + p.hh * s * st, p.hw * s * ct * belly * ridge);
}
function surfZ(x, y) { // 身體在 (x, y) 位置的表面厚度（半寬）
  const t = clamp((x + 2) / 4), p = prof(t), st = clamp((y - p.yc) / p.hh, -1, 1), ct = Math.sqrt(1 - st * st);
  return p.hw * ct * (1 + .1 * Math.max(0, -st)) * (1 - .22 * Math.pow(Math.abs(st), 4));
}
// 鰓蓋後緣：頭與軀幹的分界（隨高度彎曲）
const tCut = th => { const st = Math.sin(th); return .74 - .045 * Math.exp(-(((st - .08) / .5) ** 2)) + .035 * Math.max(0, -st) ** 2; };
const spineY = t => { const p = prof(t); return p.yc + .2 * p.hh * sstep(0, .3, t); };
// 貼圖座標：u = t，v 對應 θ = -π/2 + 2πv（接縫在腹中線）
const TH = v => -Math.PI / 2 + 2 * Math.PI * v;
const VofTH = th => (th + Math.PI / 2) / (2 * Math.PI);

/* ================= 網格產生器 ================= */
function gridGeo(nu, nv, fn, { seam = false, uvFn = null } = {}) {
  const n = (nu + 1) * (nv + 1), pos = new Float32Array(n * 3), uv = new Float32Array(n * 2), idx = [], p = V();
  for (let i = 0; i <= nu; i++) for (let j = 0; j <= nv; j++) {

    const q = uvFn ? uvFn(u, v) : [u, v]; uv[k * 2] = q[0]; uv[k * 2 + 1] = q[1];
  }
  for (let i = 0; i < nu; i++) for (let j = 0; j < nv; j++) {
    const a = i * (nv + 1) + j, b = a + nv + 1; idx.push(a, b, a + 1, b, b + 1, a + 1);

  game = { placed: 0, start: performance.now(), done: false };
  $('gcnt').textContent = `0 / ${ORDER.length}`;
  toast('拖曳部位，放回魚骨上對應的位置。建議由內而外：內臟 → 魚鰾 → 魚鰓 → 魚肉 → 魚頭 → 魚皮 → 魚鱗 → 魚鰭');
}
function placePart(p) {
  p.placed = true; p.dispTarget.set(0, 0, 0); p.rotZTarget = 0; game.placed++;
  $('gcnt').textContent = `${game.placed} / ${ORDER.length}`;
  const d = INFO[p.key]; seen.add(p.key); select(p.key);
  toast(`✔ ${d.name}歸位！${d.name}可以變成：${d.use[0]}`);
  if (game.placed === ORDER.length) {
    game.done = true; const s = Math.round((performance.now() - game.start) / 1000);
    setTimeout(() => { $('mTime').textContent = `用時 ${fmt(s)}`; $('modal').classList.add('show'); controls.autoRotate = true; }, 1400);
  }
}
const fmt = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
$('gHint').onclick = () => {
  const k = GAME_HINT.find(k => !parts[k].placed); if (!k) return;
  const where = { viscera: '魚骨下方的腹腔', bladder: '脊椎骨的正下方', gills: '頭部後方、肋骨前面', fillet: '包在魚骨左右兩側', head: '魚骨的最前端', skin: '包住整個魚身', scales: '蓋在魚皮外面', fins: '背、腹、胸和尾巴' }[k];
  toast(`提示：把「${INFO[k].name}」拖到${where}`); flash = { key: k, t: 0 };
};
$('gRestart').onclick = () => { ORDER.forEach(k => { parts[k].placed = true; }); startGame(); };
$('gExit').onclick = () => setMode('explore');
$('mAgain').onclick = () => { $('modal').classList.remove('show'); controls.autoRotate = false; startGame(); };
$('mBack').onclick = () => { $('modal').classList.remove('show'); setMode('explore'); };
let flash = null;

let toastTimer;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 4200); }

/* ================= 滑鼠／觸控 ================= */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pick(ev) {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const vis = pickables.filter(m => { let o = m; while (o) { if (!o.visible) return false; o = o.parent; } return true; });
  const hits = ray.intersectObjects(vis, false);
  for (const h of hits) {
    const k = h.object.userData.part;
    if (xray && mode === 'explore' && ['scales', 'skin', 'fillet', 'head', 'fins'].includes(k) && hits.some(o => !['scales', 'skin', 'fillet', 'head', 'fins'].includes(o.object.userData.part))) continue;
    return { key: k, point: h.point };
  }
  return null;
}
let down = null, drag = null;
const dragPlane = new THREE.Plane(), tmpV = V();
function startDrag(p, point, ev) {
  controls.enabled = false; down = { x: ev.clientX, y: ev.clientY, t: performance.now() };
  dragPlane.setFromNormalAndCoplanarPoint(camera.getWorldDirection(V()).negate(), point);
  drag = { p, grab: point.clone().sub(p.disp) }; p.dragging = true; p.rotZTarget = 0;
  try { stage.setPointerCapture(ev.pointerId); } catch (e) {}
  select(p.key);
}
stage.addEventListener('pointerdown', ev => {
  down = { x: ev.clientX, y: ev.clientY, t: performance.now() };
  if (controls.autoRotate && mode === 'explore' && !userSpin) controls.autoRotate = false;
  $('hint').style.opacity = 0;
  if (mode === 'game' && !game?.done) {
    const h = pick(ev);
    if (h && ORDER.includes(h.key) && !parts[h.key].placed) {
      startDrag(parts[h.key], h.point, ev);
    }
  }
}, true);
stage.addEventListener('pointermove', ev => {
  if (drag) {
    const r = renderer.domElement.getBoundingClientRect();
    ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    if (ray.ray.intersectPlane(dragPlane, tmpV)) drag.p.disp.copy(tmpV).sub(drag.grab);
    return;
  }
  if (ev.pointerType === 'mouse') { pendingHover = ev; }
});
let pendingHover = null;
function endDrag(ev) {
  if (drag) {
    const p = drag.p; p.dragging = false; drag = null; controls.enabled = true;
    if (p.disp.length() < 1.15) placePart(p);
    else { p.dispTarget.copy(p.disp); toast(`再靠近一點！把「${INFO[p.key].name}」拖到它在魚身上的位置`); }
    return;
  }
  if (down && Math.hypot(ev.clientX - down.x, ev.clientY - down.y) < 6 && mode === 'explore') { const h = pick(ev); select(h ? h.key : null); }
  down = null;
}
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', () => { if (drag) { drag.p.dragging = false; drag.p.dispTarget.copy(drag.p.disp); drag = null; controls.enabled = true; } });
let userSpin = false;
$('bSpin').addEventListener('click', () => userSpin = controls.autoRotate);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); labelRenderer.setSize(innerWidth, innerHeight);
  applyLayout(); if (!controlsTouched) fitView(true);
});

/* ================= 主迴圈 ================= */
const clock = new THREE.Clock();
let lastFitT = -1;
function loop() {
  const dt = Math.min(clock.getDelta(), .05);
  if (tween) { tween.t += dt; const k = clamp(tween.t / tween.dur); globalT = lerp(tween.from, tween.to, k); setTargetsFromT(globalT); slider.value = Math.round(globalT * 1000); if (k >= 1) tween = null; }
  for (const key of LIST) applyPart(parts[key], dt);
  { const still = mode === 'explore' ? 1 - clamp(maxE() * 5) : (game && game.done ? 1 : 0);
    const target = swimOn ? .075 * still : 0; SWIM.uSwimAmp.value += (target - SWIM.uSwimAmp.value) * Math.min(1, dt * 2);
    const T = SWIM.uSwimTime.value += dt, beat = .5 + .5 * Math.sin(T * .23) * Math.sin(T * .61 + 1.3);
    SWIM.uSwimBeat.value = beat; SWIM.uSwimPhase.value += dt * (2.0 + 1.3 * beat); }
  ground.material.opacity = mode === 'game' ? .06 : lerp(.13, .05, maxE());
  if (game && !game.done) $('gtime').textContent = fmt(Math.round((performance.now() - game.start) / 1000));
  if (flash) {
    flash.t += dt; const p = parts[flash.key], on = Math.floor(flash.t * 6) % 2 === 0 && flash.t < 1.8;
    p.mats.forEach(m => m.emissive && m.emissive.setRGB(on ? .35 : 0, on ? .3 : 0, on ? .1 : 0)); if (flash.t >= 1.8) { flash = null; refreshMaterials(); }
  }
  if (pendingHover) {
    const h = pick(pendingHover); pendingHover = null; const k = h ? h.key : null;
    const can = k && (mode === 'explore' || (ORDER.includes(k) && !parts[k].placed));
    renderer.domElement.style.cursor = can ? (mode === 'game' ? 'grab' : 'pointer') : '';
    if (k !== hover) { hover = k; refreshMaterials(); }
  }
  // 拆解時自動拉遠鏡頭（使用者沒有手動操作時）
  if (mode === 'explore' && !camGoal) {
    const T = Math.round(maxE() * 20) / 20;
    if (T !== lastFitT && !controlsTouched) { lastFitT = T; fitView(true); }
  }
  if (camGoal) {
    camGoal.t += dt * 1.6; const k = 1 - Math.exp(-dt * 4);
    camera.position.lerp(camGoal.pos, k); controls.target.lerp(camGoal.target, k);
    if (camGoal.t > 2.5) camGoal = null;
  }
  controls.update();
  updateLabels();
  renderer.render(scene, camera); labelRenderer.render(scene, camera);
  requestAnimationFrame(loop);
}
let controlsTouched = false;
controls.addEventListener('start', () => { controlsTouched = true; camGoal = null; });
$('bReset').addEventListener('click', () => { controlsTouched = false; });
$('bExplode').addEventListener('click', () => { controlsTouched = false; });
$('bAssemble').addEventListener('click', () => { controlsTouched = false; });

LIST.forEach(k => setInner(parts[k], 0));
refreshMaterials(); renderInfo(); fitView(false);
controls.autoRotate = true;
loop();
setTimeout(() => { $('loading').style.opacity = 0; setTimeout(() => $('loading').remove(), 700); }, 250);
window.__fish = { SWIM, parts, scene, camera, controls, THREE, renderer, setMode, select, fitView };
</script>
